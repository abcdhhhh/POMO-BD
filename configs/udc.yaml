# train/val/test
mode: train
env_name: tsp
num_loc: 1000
env_r_name: ${env_name}
num_loc_r: 101
embed_dim: 128
num_heads: 8
save_dir: ./outputs/
ckpt_path: null

env:
  env_name: ${env_name}
  generator_params:
    num_loc: ${num_loc}
  check_solution: False # optimization
  data_dir: ./data/
  val_file: ${env_name}/${env_name}${num_loc}_val_seed4321.npz
  test_file: ${env_name}/${env_name}${num_loc}_test_seed1234.npz

env_r:
  env_name: ${env_r_name}
  generator_params:
    num_loc: ${num_loc_r}
  check_solution: False # optimization

logger:
  project: "rl4co"
  tags: ["udc", "${env_name}"]
  group: "${env_name}${num_loc}"
  save_dir: ${save_dir}
  name: udc-${env_name}${num_loc}-${env_r_name}${num_loc_r}-${model.w}

model:
  batch_size: 1
  val_batch_size: 16
  train_data_size: 1000
  val_data_size: 128
  num_loc_min: 500
  num_loc_max: 1000
  alpha_train: 40
  beta_train: 50
  alpha_val: 50
  beta_val: 2
  # set 2 for training
  iters: 2
  sub_norm: true
  w: 1.
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [480, 495]
    gamma: 0.1
  metrics:
    train: ["loss", "loss_r0", "loss_r1", "reward", "max_reward", "num_loc"]
    val: ["reward", "max_reward"]
    test: ${model.metrics.val}
    log_on_step: True

  policy_d_name: dgnn
  policy_d_kwargs:
    # set 'multistart_sampling' for symmetric problems, 'sampling' for others
    train_decode_type: multistart_sampling
    # set 'multistart_greedy' for symmetric problems, 'sampling' for others
    val_decode_type: multistart_greedy
    test_decode_type: ${model.policy_d_kwargs.val_decode_type}
    num_layers_heatmap_generator: 3
    num_layers_graph_encoder: 12
    k_sparse: 100
    
  policy_r_name: icam
  policy_r_kwargs:
    train_decode_type: sampling
    # set 'greedy' for num_starts==1
    val_decode_type: greedy
    test_decode_type: ${model.policy_r_kwargs.val_decode_type}
    # set 'poly' for polynet attention, 'null' for simple attention
    pointer: null
    # set 'am' for am, 'null' for icam
    encoder: null
    decoder: null
    embed_dim: ${embed_dim}
    tanh_clipping: 50.
    num_encoder_layers: 6
    normalization: instance
  
trainer:
  max_epochs: 500
  precision: 32-true # udc is sensitive to precision
  # set 'wandb' if use wandb, 'null' otherwise
  logger: null
  default_root_dir: ${save_dir}

seed: 1234
