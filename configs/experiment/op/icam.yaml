# @package _global_

# train/val/test
mode: test
env_name: op
num_loc: 100
embed_dim: 128
num_heads: 8
save_dir: ./outputs/
ckpt_path: pretrained/op100/icam/199_30.2519_32.7912.ckpt

env:
  env_name: ${env_name}
  generator_params:
    num_loc: ${num_loc}
    # for OP
    # max_length: 8
    # for PCTSP
    # max_penalty: 9
    # for MTVRP
    # variant_preset: all
  load_solutions: False
  check_solution: False # optimization
  data_dir: ./data/

  val_file: [op/val/100_dist.npz]
  test_file: [op/val/100_dist.npz]

model:
  batch_size: 128
  val_batch_size: 500
  test_batch_size: ${model.val_batch_size}
  train_data_size: 128000
  val_data_size: 10000
  test_data_size: ${model.val_data_size}

  # keep batch_size * num_augment_train a constant for fair comparison
  num_augment_train_list: []
  num_augment_list: [8]
  # choose from 'dihedral8', 'symmetric', 'pdp', 'atsp'
  augment_fn_train_list: []
  augment_fn_list: ['dihedral8']
  # set ['locs'] for euclidean routing, ['cost_matrix'] for atsp
  feats: ['locs']

  mix_loss: True
  elite_k: 1
  elite_alpha: 0.
  po_alpha: 0.
  
  # set '128' for polynet
  num_starts: null # ${num_loc}
  # now only support 'shared'
  baseline: shared

  policy_kwargs:
    # set 'multistart_sampling' for symmetric problems, 'sampling' for others
    train_decode_type: multistart_sampling
    # set 'multistart_greedy' for symmetric problems, 'sampling/greedy' for others
    val_decode_type: multistart_sampling # ${model.policy_kwargs.train_decode_type}
    test_decode_type: ${model.policy_kwargs.val_decode_type}
    # choose from 'aft', 'mataft', 'am', 'matnet', 'ham', 'haft'
    encoder: aft
    # for aft encoder
    idt: False
    # for cab decoder
    logit_bias: True
    # choose from 'cab', 'am', 'matnet', 'vam'
    decoder: cab
    # if decoder is 'cab', then choose from 'aft', 'poly', 'polyaft', 'null', else set 'null'
    pointer: aft
    embed_dim: ${embed_dim}
    num_heads: ${num_heads}
    tanh_clipping: 50.
    num_encoder_layers: 6
    normalization: instance
    # if encoder is 'aft', 'mataft', 'haft', then choose from 'relu', 'swiglu', else 'relu'
    activation: relu
    use_graph_context: False
  
  optimizer: Adam
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [270, 295]
    gamma: 0.1
  metrics:
    train: ["loss", "reward", "max_reward"]
    val: ["reward", "max_reward", "max_aug_reward"]
    test: ${model.metrics.val}
    log_on_step: True

logger_name: ${model.policy_kwargs.encoder}-${model.policy_kwargs.decoder}-${model.policy_kwargs.pointer}-${model.policy_kwargs.normalization}-${model.policy_kwargs.activation}-${model.policy_kwargs.tanh_clipping}-${model.batch_size}${model.num_augment_train_list}-${model.policy_kwargs.train_decode_type}-${model.policy_kwargs.logit_bias}-${model.optimizer}-${model.optimizer_kwargs.lr}-${model.optimizer_kwargs.weight_decay}
logger:
  # project: am
  # tags: ["${env_name}"]
  # group: ${env_name}${num_loc}
  save_dir: ${save_dir}
  name: ${env_name}${num_loc}/${logger_name}


ckpt:
  monitor: val/max_reward
  filename: "{epoch:02d}_{val/reward:.4f}_{val/max_reward:.4f}"
  auto_insert_metric_name: False
  save_top_k: -1
  every_n_epochs: 50
  save_last: True
  mode: max

trainer:
  max_epochs: 200
  precision: 16-mixed # set '32-true' if use aft encoder
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  # set 'wandb' if use wandb, 'tensorboard' if use tensorboard, 'null' otherwise
  logger: null
  default_root_dir: ${save_dir}
  check_val_every_n_epoch: 1

seed: 1234
