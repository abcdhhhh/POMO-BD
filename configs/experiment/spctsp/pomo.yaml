# @package _global_

defaults:
  - /experiment/tsp/pomo.yaml

env_name: spctsp
num_loc: 20
env:
  val_file: pctsp/val/${num_loc}.npz
  test_file: pctsp/test/${num_loc}.npz
model:
  policy_kwargs:
    # set 'multistart_sampling' for symmetric problems, 'sampling' for others
    train_decode_type: sampling
    # set 'multistart_greedy' for symmetric problems, 'sampling/greedy' for others
    val_decode_type: greedy # ${model.policy_kwargs.train_decode_type}
    test_decode_type: ${model.policy_kwargs.val_decode_type}
ckpt_path: outputs/checkpoints/spctsp20/am-am-None-instance-relu-50.0-50[]-sampling-False-Adam-0.0003-1e-06/last.ckpt
ckpt:
  monitor: val/reward
  filename: "{epoch:02d}_{val/reward:.4f}"