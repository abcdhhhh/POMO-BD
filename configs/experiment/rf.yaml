# @package _global_

# train/val/test
mode: test
env_name: mtvrp
num_loc: 50
embed_dim: 128
num_heads: 8
save_dir: ./outputs/
ckpt_path: pretrained/mtvrp50/rf-te/299_-10.9144_-10.5382.ckpt

env:
  env_name: ${env_name}
  generator_params:
    num_loc: ${num_loc}
    # for OP
    # max_length: 8
    # for PCTSP
    # max_penalty: 9
    # for MTVRP
    variant_preset: all
  load_solutions: False
  select_start_nodes_fn: all
  check_solution: False # optimization
  data_dir: ./data/mtvrp/

  val_file: [cvrp/val/50.npz, ovrpbltw/val/50.npz]
  test_file: [cvrp/test/50.npz, ovrp/test/50.npz, ovrpb/test/50.npz, ovrpbl/test/50.npz,
              ovrpbltw/test/50.npz, ovrpbtw/test/50.npz, ovrpl/test/50.npz, ovrpltw/test/50.npz,
              ovrptw/test/50.npz, vrpb/test/50.npz, vrpl/test/50.npz, vrpbltw/test/50.npz,
              vrpbtw/test/50.npz, vrpbl/test/50.npz, vrpltw/test/50.npz, vrptw/test/50.npz,
  ]
  test_dataloader_names: [cvrp50, ovrp50, ovrpb50, ovrpbl50,
                         ovrpbltw50, ovrpbtw50, ovrpl50, ovrpltw50,
                         ovrptw50, vrpb50, vrpl50, vrpbltw50,
                         vrpbtw50, vrpbl50, vrpltw50, vrptw50,
  ]

model:
  batch_size: 256
  val_batch_size: 500
  test_batch_size: ${model.val_batch_size}
  train_data_size: 100000
  val_data_size: 1000
  test_data_size: ${model.val_data_size}

  # keep batch_size * num_augment_train a constant for fair comparison
  num_augment_train_list: []
  num_augment_list: [8]
  # choose from 'dihedral8', 'symmetric', 'pdp', 'atsp'
  augment_fn_train_list: []
  augment_fn_list: ['dihedral8']
  # set ['locs'] for euclidean routing, ['cost_matrix'] for atsp
  feats: ['locs']

  mix_loss: True
  elite_k: 1
  elite_alpha: 0.
  po_alpha: 0.
  
  # set '128' for polynet
  num_starts: null # ${num_loc}
  # now only support 'shared'
  baseline: shared

  policy_kwargs:
    # set 'multistart_sampling' for symmetric problems, 'sampling' for others
    train_decode_type: multistart_sampling
    # set 'multistart_greedy' for symmetric problems, 'sampling/greedy' for others
    val_decode_type: multistart_greedy # ${model.policy_kwargs.train_decode_type}
    test_decode_type: ${model.policy_kwargs.val_decode_type}
    # choose from 'aft', 'mataft', 'am', 'matnet', 'ham', 'haft'
    encoder: te
    # for aft encoder
    idt: False
    # for cab decoder
    logit_bias: False
    # choose from 'cab', 'am', 'matnet', 'vam'
    decoder: am
    # if decoder is 'cab', then choose from 'aft', 'poly', 'polyaft', 'reld', 'null', else set 'null'
    pointer: null
    embed_dim: ${embed_dim}
    num_heads: ${num_heads}
    tanh_clipping: 10.
    num_encoder_layers: 6
    normalization: rms
    # if encoder is 'aft', 'mataft', 'haft', then choose from 'relu', 'swiglu', else 'relu'
    activation: swiglu
    use_graph_context: False
  
  optimizer: Adam
  optimizer_kwargs:
    lr: 3e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [270, 295]
    gamma: 0.1
  metrics:
    train: ["loss", "reward", "max_reward", "norm_vals", "norm_reward", "max_norm_reward"]
    val: ["reward", "max_reward", "max_aug_reward"]
    test: ${model.metrics.val}
    log_on_step: True

  # for mtvrp normalization
  alpha: 0.25
  epsilon: 1e-5
  normalize_reward: exponential
  norm_operation: div

logger:
  # project: am
  # tags: ["${env_name}"]
  # group: ${env_name}${num_loc}
  save_dir: ${save_dir}
  name: ${env_name}${num_loc}/${model.policy_kwargs.encoder}-${model.policy_kwargs.decoder}-${model.policy_kwargs.pointer}-${model.num_starts}${model.num_augment_train_list}-${model.policy_kwargs.train_decode_type}-${model.policy_kwargs.logit_bias}-${model.po_alpha}


ckpt:
  monitor: val/max_reward/0
  filename: "{epoch:02d}_{val/reward/0:.4f}_{val/max_reward/0:.4f}"
  auto_insert_metric_name: False
  save_top_k: -1
  every_n_epochs: 50
  save_last: True
  mode: max

trainer:
  max_epochs: 300
  precision: 32-true # set '32-true' if use aft encoder
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  # set 'wandb' if use wandb, 'tensorboard' if use tensorboard, 'null' otherwise
  logger: null
  default_root_dir: ${save_dir}
  check_val_every_n_epoch: 1

seed: 1234
