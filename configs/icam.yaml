# train or val
mode: train
env_name: tsp
num_loc: 500
embed_dim: 128
num_heads: 8
save_dir: ./outputs/
ckpt_path: null

env:
  env_name: ${env_name}
  generator_params:
    num_loc: ${num_loc}
  check_solution: False # optimization
  data_dir: ./data/
  val_file: ${env_name}/${env_name}${num_loc}_val_seed4321.npz
  test_file: ${env_name}/${env_name}${num_loc}_test_seed1234.npz

logger:
  project: "rl4co"
  tags: ["icam", "${env_name}"]
  group: "${env_name}${num_loc}"
  save_dir: ${save_dir}
  name: icam-${env_name}${num_loc}-${model.num_starts}

# polynet_attention
poly:
  k: ${model.num_starts}
  embed_dim: ${embed_dim}
  num_heads: ${num_heads}
  mask_inner: true
  out_bias_pointer_attn: false 
  check_nan: true 
  sdpa_fn: null

model:
  batch_size: 32
  val_batch_size: 32
  train_data_size: 32_000
  val_data_size: 128
  # During val/test only we apply dihedral transformations
  num_augment: 1
  elite_k: 1
  elite_alpha: 0.
  num_starts: 50
  baseline: shared
  policy_kwargs:
    # set 'multistart_sampling' for symmetric problems, 'sampling' for others
    train_decode_type: multistart_sampling
    # set 'multistart_greedy' for symmetric problems, 'sampling/greedy' for others
    val_decode_type: multistart_greedy
    # set 'poly' for polynet attention, 'null' for simple attention
    pointer: null
    # set 'am' for am encoder, 'null' for icam encoder
    encoder: null
    embed_dim: ${embed_dim}
    tanh_clipping: 50.
    num_encoder_layers: 6
    normalization: instance
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [480, 495]
    gamma: 0.1
  metrics:
    train: ["loss", "reward", "max_reward"]
    val: ["reward", "max_reward", "max_aug_reward"]
    log_on_step: True

trainer:
  max_epochs: 500
  precision: 32-true
  # set 'wandb' if use wandb, 'null' otherwise
  logger: null

seed: 1234
