# train or val
mode: train
env_name: shpp
num_loc: 50
embed_dim: 128
num_heads: 8
save_dir: ./outputs/
ckpt_path: null

env:
  env_name: ${env_name}
  generator_params:
    num_loc: ${num_loc}
  check_solution: False # optimization
  data_dir: ./rl4co/data/
  val_file: ${env_name}/${env_name}${num_loc}_val_seed4321.npz
  test_file: ${env_name}/${env_name}${num_loc}_test_seed1234.npz

logger:
  project: "rl4co"
  tags: ["icam", "${env_name}"]
  group: "${env_name}${num_loc}"
  save_dir: ${save_dir}
  name: "icam-${env_name}${num_loc}-${poly.k}${model.policy_kwargs.pointer}${model.policy_kwargs.encoder}"

# polynet_attention
poly:
  k: ${model.num_starts}
  embed_dim: ${embed_dim}
  num_heads: ${num_heads}
  mask_inner: true
  out_bias_pointer_attn: false 
  check_nan: true 
  sdpa_fn: null

model:
  batch_size: 64
  val_batch_size: 500
  train_data_size: 160_000
  val_data_size: 10_000
  # During val/test only we apply dihedral transformations
  num_augment: 8
  elite_k: 1
  elite_alpha: 0.
  num_starts: 80
  policy_kwargs:
    # set 'multistart_sampling' for symmetric problems, 'sampling' for others
    train_decode_type: sampling
    # set 'multistart_greedy' for symmetric problems, 'sampling' for others
    val_decode_type: sampling
    # set 'poly' if use polynet attention, 'null' otherwise
    pointer: poly
    # set 'am' if use am encoder, 'null' otherwise
    encoder: null
    embed_dim: ${embed_dim}
    tanh_clipping: 50.
    num_encoder_layers: 6
    normalization: instance
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [80, 95]
    gamma: 0.1
  metrics:
    train: ["loss", "reward", "max_reward"]
    val: ["reward", "max_reward", "max_aug_reward"]
    log_on_step: True

trainer:
  max_epochs: 100
  precision: 32-true
  # set 'wandb' if use wandb
  logger: wandb

seed: 1234
