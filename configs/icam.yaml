# train/val/test
mode: train
env_name: sympdp
num_loc: 100
embed_dim: 128
num_heads: 8
save_dir: ./outputs/
ckpt_path: null

env:
  env_name: ${env_name}
  generator_params:
    num_loc: ${num_loc}
  check_solution: False # optimization
  data_dir: ./data/
  # val_file: ${env_name}/${env_name}${num_loc}_val_seed4321.npz
  # test_file: ${env_name}/${env_name}${num_loc}_test_seed1234.npz
  # val_file: vrp/vrp${num_loc}_val_seed4321.npz
  # test_file: vrp/vrp${num_loc}_test_seed1234.npz
  # val_file: op/op_dist${num_loc}_val_seed4321.npz
  # test_file: op/op_dist${num_loc}_test_seed1234.npz
  # val_file: pctsp/pctsp${num_loc}_val_seed4321.npz
  # test_file: pctsp/pctsp${num_loc}_test_seed1234.npz
  val_file: pdp/pdp${num_loc}_val_seed4321.npz
  test_file: pdp/pdp${num_loc}_test_seed1234.npz

logger:
  project: "rl4co"
  tags: ["${env_name}"]
  group: "${env_name}${num_loc}"
  save_dir: ${save_dir}
  name: ${model.policy_kwargs.encoder}-${model.policy_kwargs.decoder}-${model.policy_kwargs.pointer}-${env_name}${num_loc}-${model.num_starts}*${model.num_augment_train}-${model.policy_kwargs.train_decode_type}-${model.policy_kwargs.val_decode_type}-po${model.po_alpha}

model:
  batch_size: 8
  val_batch_size: 200
  test_batch_size: ${model.val_batch_size}
  train_data_size: 20000
  val_data_size: 10000
  test_data_size: ${model.val_data_size}
  # if > 1, divide train_{data,batch}_size by num_augment_train for fair comparison 
  num_augment_train: 8
  num_augment: 8
  # set 'symmetric' if num_augment not in [1, 8], otherwise 'dihedral' (default)
  # augment_fn: symmetric
  elite_k: 1
  elite_alpha: 0.
  po_alpha: 0.05
  # set '0' for am, '${num_loc}' for pomo, ${num_loc}+1 for sym{op,(s)pctsp,pdp}, ${num_loc}/2 for pdp
  num_starts: 50 # ${num_loc}
  # set 'rollout' for am, 'shared' for pomo
  baseline: shared
  policy_kwargs:
    # set 'multistart_sampling' for symmetric problems, 'sampling' for others
    train_decode_type: multistart_sampling
    # set 'multistart_greedy' for symmetric problems, 'sampling/greedy' for others
    val_decode_type: multistart_greedy
    test_decode_type: ${model.policy_kwargs.val_decode_type}
    # choose from 'aft', 'mataft', 'am', 'matnet', 'ham'
    encoder: ham
    # choose from 'cab', 'am', 'matnet'
    decoder: am
    # if decoder is 'cab', then choose from 'aft', 'poly', 'null', else set 'null'
    pointer: null
    embed_dim: ${embed_dim}
    num_heads: ${num_heads}
    tanh_clipping: 10.
    num_encoder_layers: 6
    normalization: instance
    use_graph_context: False
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: []
    gamma: 0.1
  metrics:
    train: ["loss", "reward", "max_reward", "max_aug_reward"]
    val: ["reward", "max_reward", "max_aug_reward"]
    test: ${model.metrics.val}
    log_on_step: True

trainer:
  max_epochs: 2000
  precision: 32-true # set '32-true' if use aft encoder
  # set 'wandb' if use wandb, 'null' otherwise
  logger: null
  default_root_dir: ${save_dir}

ckpt:
  monitor: val/reward
  filename: "{epoch:02d}_{val/reward:.4f}_{val/max_reward:.4f}"
  auto_insert_metric_name: False
  save_top_k: 3
  save_last: True
  mode: max

seed: 1234
